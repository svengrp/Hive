# Modèle nginx : ${BACKEND_ORIGIN} est remplacé au démarrage du conteneur
# (image nginx officielle : /etc/nginx/templates/*.template → conf.d/, voir Dockerfile).

# Robots de partage (LinkedIn, WhatsApp, Facebook, X…) : ils n'exécutent pas le JavaScript,
# ils reçoivent donc l'aperçu Open Graph du projet généré par l'API.
# Google exécute le JavaScript : il reçoit l'application normale (mêmes titres et descriptions).
map $http_user_agent $share_bot {
    default 0;
    ~*(facebookexternalhit|facebookcatalog|meta-externalagent|linkedinbot|twitterbot|slackbot|discordbot|telegrambot|whatsapp|skypeuripreview|pinterest|redditbot|embedly|mastodon) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker : l'adresse du backend est résolue à la requête,
    # nginx démarre même si le backend n'est pas encore prêt
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend "${BACKEND_ORIGIN}";

    # Obligatoire pour react-router-dom
    # Sans ça, F5 sur /project/42 = erreur 404
    location / {
        try_files $uri /index.html;
    }

    # Sitemap généré par l'API (projets ouverts et publics)
    location = /sitemap.xml {
        proxy_pass $backend/api/seo/sitemap.xml;
    }

    # Page d'un projet : aperçu Open Graph pour les robots de partage, application sinon
    location ~ "^/projects/([0-9a-fA-F]{24})/?$" {
        add_header Vary User-Agent always;
        if ($share_bot) {
            proxy_pass $backend/api/seo/share/projects/$1;
        }
        try_files $uri /index.html;
    }

    # Profils de personnes : jamais indexés
    location /users/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }

    # Cache navigateur pour les assets statiques
    # React génère des noms uniques (main.abc123.js)
    # donc 1 an de cache est safe
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Désactive les logs d'accès pour le favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
