<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16120e" />
    <meta
      name="description"
      content="Trouve les bonnes personnes pour faire naître ton projet : coéquipiers, bénévoles, associés. Projets près de chez toi, en Suisse romande et ailleurs."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hive-app.ch/" />

    <!-- Aperçu des liens partagés (LinkedIn, WhatsApp, Facebook, X…).
         Mis à jour par src/lib/seo.js ; les robots de partage reçoivent la version
         propre à chaque projet via nginx → /api/seo/share/projects/:id -->
    <meta property="og:site_name" content="Hive" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CH" />
    <meta property="og:title" content="Hive — Trouve les bonnes personnes pour ton projet" />
    <meta property="og:description" content="Trouve les bonnes personnes pour faire naître ton projet : coéquipiers, bénévoles, associés. Projets près de chez toi, en Suisse romande et ailleurs." />
    <meta property="og:url" content="https://hive-app.ch/" />
    <meta property="og:image" content="https://hive-app.ch/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hive — Réunir les bonnes personnes autour de n'importe quel projet" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hive — Trouve les bonnes personnes pour ton projet" />
    <meta name="twitter:description" content="Trouve les bonnes personnes pour faire naître ton projet : coéquipiers, bénévoles, associés. Projets près de chez toi, en Suisse romande et ailleurs." />
    <meta name="twitter:image" content="https://hive-app.ch/og-image.png" />

    <!-- Données structurées : nom du site et organisation (résultats Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "Hive", "url": "https://hive-app.ch/", "inLanguage": ["fr", "en"] },
          { "@type": "Organization", "name": "Hive", "url": "https://hive-app.ch/", "logo": "https://hive-app.ch/logo512.png" }
        ]
      }
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Hive — Trouve les bonnes personnes pour ton projet</title>
  </head>
  <body>
    <script>
      /* Applique le thème avant le premier rendu (sinon flash de l'autre thème). */
      try {
        if ((localStorage.getItem("hive-theme") || "light") === "light") document.body.classList.add("light");
      } catch (e) {
        document.body.classList.add("light");
      }
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
